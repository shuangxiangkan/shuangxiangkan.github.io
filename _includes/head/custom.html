{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Custom typography overrides for a cleaner, smaller look -->
<style>
  html { font-size: 14px; }
  body, .page__content {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
                 Helvetica, Arial, sans-serif;
    line-height: 1.65;
    color: #333;
  }
  .page__content { font-size: 0.95rem; }
  .page__content h1 { font-size: 1.6rem; margin-top: 1.5em; margin-bottom: 0.6em; }
  .page__content h2 { font-size: 1.3rem; margin-top: 1.6em; margin-bottom: 0.5em;
                      padding-bottom: 0.25em; border-bottom: 1px solid #eee; }
  .page__content h3 { font-size: 1.1rem; }
  .page__content p, .page__content li { font-size: 0.95rem; }
  .page__content ol li, .page__content ul li { margin-bottom: 0.5em; }
  .page__title { font-size: 1.8rem; }
  .author__name { font-size: 1.1rem; }
  .author__bio, .author__urls li { font-size: 0.85rem; }
  .greedy-nav a { font-size: 0.9rem; }
  code { font-size: 0.85em; }
  @media (min-width: 80em) { html { font-size: 15px; } }
</style>

<!-- end custom head snippets -->
